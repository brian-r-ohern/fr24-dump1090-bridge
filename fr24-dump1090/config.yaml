name: "FR24 dump1090 Bridge"
version: "0.5.4"
slug: "fr24_dump1090"
description: >-
  Normalizes a selected local aircraft data source into
  dump1090/readsb-compatible aircraft.json endpoints.
url: "https://github.com/brian-r-ohern/fr24-dump1090-bridge"
arch:
  - amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8085
homeassistant_api: true
panel_icon: mdi:airplane
panel_title: "FR24 ADS-B"
apparmor: true
ports:
  8085/tcp: null
ports_description:
  8085/tcp: "FR24 dump1090 bridge HTTP service (optional LAN exposure)"
options:
  source: "sbs_30003"
  receiver_port: 80
  sbs_port: 30003
  poll_interval: 2
  request_timeout: 3
  aircraft_json_poll_interval: 1
  enrichment_source: "adsb_tracker"
  swim_product: "tfms"
  swim_radius_nm: 250
  swim_aircraft_timeout: 120
  swim_retry_count: 3
  swim_retry_interval_ms: 3000

schema:
  source: "list(sbs_30003|flights_js|aircraft_json|swim_tfms)"
  receiver_host: str?
  sbs_port: port?
  receiver_port: port?
  username: str?
  password: password?
  poll_interval: "int(1,60)?"
  request_timeout: "int(1,30)?"
  aircraft_json_url: str?
  aircraft_json_poll_interval: "int(1,60)?"
  enrichment_source: "list(adsb_tracker|none)"
  swim_product: "list(tfms)?"
  swim_host: str?
  swim_vpn: str?
  swim_username: str?
  swim_password: password?
  swim_queue: str?
  swim_radius_nm: "int(25,1000)?"
  swim_aircraft_timeout: "int(30,900)?"
  swim_retry_count: "int(0,20)?"
  swim_retry_interval_ms: "int(500,60000)?"
  history_url: str?
  destination_airport: str?
